<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-Portrait Without a Mirror</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0c0c0b; overflow: hidden; }
  body { display: grid; place-items: center; color: #F0EEE6; font: 14px/1.5 "Plex Mono", ui-monospace, monospace; }
  canvas { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #141413; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
             background: rgba(12, 12, 11, .62); transition: opacity .5s; text-align: center; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { margin: 0 0 .7em; font: 300 clamp(26px, 4.2vw, 60px)/1.1 Newsreader, Georgia, serif; }
  #overlay p { margin: .35em 0; opacity: .62; letter-spacing: .06em; }
  body.render { display: block; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render #overlay { display: none; }
</style>
</head>
<body>
<canvas id="portrait" width="1920" height="1080"></canvas>
<div id="overlay" hidden>
  <div>
    <h1>Self-Portrait Without a Mirror</h1>
    <p id="overlay-action">click to play &middot; with sound</p>
    <p>space: pause &middot; &larr; &rarr;: seek</p>
  </div>
</div>
<script src="portrait.js"></script>
</body>
</html>
